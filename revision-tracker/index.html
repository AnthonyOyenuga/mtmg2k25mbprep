async function docxText(buf){const v=new DataView(buf),u8=new Uint8Array(buf);let e=-1;for(let i=u8.length-22;i>=0;i--)if(v.getUint32(i,true)==0x06054b50){e=i;break}if(e<0)throw new Error("not a .docx file");let p=v.getUint32(e+16,true);const n=v.getUint16(e+10,true),dec=new TextDecoder();
 for(let k=0;k<n;k++){const meth=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),el=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),lo=v.getUint32(p+42,true),name=dec.decode(u8.subarray(p+46,p+46+nl));
  if(name=="word/document.xml"){const st=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true),data=u8.subarray(st,st+cs);let xml;if(meth==0)xml=dec.decode(data);else xml=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
   return xml.split("</w:p>").map(pp=>(pp.match(/<w:t(?: [^>]*)?>[^<]*<\/w:t>|<w:tab\/>|<w:br\/>/g)||[]).map(x=>/^<w:t[ >]/.test(x)?x.replace(/<[^>]+>/g,""):" ").join("")).map(s=>s.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&")).join("\n")}
  p+=46+nl+el+cl}throw new Error("document.xml not found")}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-qa]");if(!b)return;const z=QZ(),a=b.dataset.qa;
 try{if(a=="signin")login();
  else if(a=="mode")await qstart(b.dataset.id,b.dataset.mode);
  else if(a=="again"){z.sess=null;await qstart(b.dataset.id,"missed")}
  else if(a=="reveal"){z.sess.reveal=true;render()}
  else if(a=="pick")qanswer(+b.dataset.k);
  else if(a=="next"){z.sess.i++;z.sess.pick=null;z.sess.reveal=!z.think;render();window.scrollTo(0,0)}
  else if(a=="quit"){z.sess=null;z.note="";render();qinit()}
  else if(a=="detail"){z.detail=b.dataset.id;z.filter="all";await qopen(z.detail);render()}
  else if(a=="back"){z.detail=null;render()}
  else if(a=="filter"){z.filter=b.dataset.qf;render()}
  else if(a=="toggle"){z.open=z.open==b.dataset.id?null:b.dataset.id;render()}
  else if(a=="fday"){z.fday=b.dataset.v;z.open=null;render()}
  else if(a=="retry")qinit();
  else if(a=="resetq"){if(confirm("Clear your progress on this quiz?")){await qapi("POST",{action:"resetq",id:z.detail});Object.keys(z.prog).forEach(k=>{if(k.startsWith(z.detail+"|"))delete z.prog[k]});render()}}
  else if(a=="parse"){const u=z.up;if(!u.text.trim()){u.msg="Paste or upload some questions first.";render();return}u.res=parseAny(u.text,u.fname);u.msg=u.res.qs.length?"":"No complete questions found. Check the format.";render()}
  else if(a=="save"){const u=z.up;if(!u.title.trim()){u.msg="Give the quiz a title first.";render();return}await qapi("POST",{action:"save",title:u.title,course:u.course,questions:u.res.qs,day:u.day||0});z.up={title:"",course:"Mixed",text:"",res:null,msg:"Quiz saved.",fname:""};await qinit()}
  else if(a=="del"){if(confirm("Delete this quiz for everyone?")){await qapi("POST",{action:"delete",id:b.dataset.id});await qinit()}}
 }catch(err){toast(err.message)}});
document.addEventListener("input",e=>{const t=e.target,u=QZ().up;if(t.id=="qtext")u.text=t.value;else if(t.id=="qtitle")u.title=t.value;else if(t.id=="qcourse")u.course=t.value});
document.addEventListener("change",async e=>{const t=e.target;
 if(t.id=="qf"&&t.files&&t.files[0]){const f=t.files[0],u=QZ().up;try{u.fname=f.name;{const m=f.name.match(/day\s*[-_ ]*(\d{1,2})/i);if(m&&+m[1]>=1&&+m[1]<=14)u.day=+m[1]}u.text=/\.docx$/i.test(f.name)?await docxText(await f.arrayBuffer()):await f.text();if(!u.title)u.title=f.name.replace(/\.[^.]+$/,"");u.res=parseAny(u.text,f.name);u.msg=u.res.qs.length?"":"No complete questions found. Check the format."}catch(err){u.msg="Could not read that file: "+err.message}render()}
 else if(t.id=="qlen"){QZ().len=+t.value;render()}else if(t.id=="qthink"){QZ().think=t.checked;render()}
 else if(t.id=="qfc"){const z=QZ();z.fc=t.value;z.open=null;render()}
 else if(t.id=="qday"){QZ().up.day=+t.value}
 else if(t.dataset.qid!==undefined){const z=QZ(),q=z.list.find(x=>x.id==t.dataset.qid);try{await qapi("POST",{action:"update",id:t.dataset.qid,day:+t.value});q.day=+t.value;render()}catch(err){toast(err.message)}}});
render();pull();setInterval(pull,8000);
</script></body></html>
