D.slice(0,10).forEach((d,di)=>d[2].forEach(r=>{const m=r[1].match(/^(\d+)\./),k=(di+1)+":"+(m?m[1]:0);r[2]=OV[k]!==undefined?OV[k]:DEFSYS[di]}));
const SES=[["Retrieval warm-up","30 min"],["MCQ round 1","75 min"],["MCQ dissection","75 min"],["Break / lunch","60 min"],["MCQ round 2","60 min"],["Essay workshop","60 min"],["Practical workshop","75 min"],["Error log and review","15 min"]];
const LAB=["Not started","Red","Amber","Green"],TYPES=["Knowledge gap","Conceptual error","Application error","Exam error"];
let S={t:{},s:{},sc:{},e:[],tab:"dash",day:1,who:"",last:null,filter:"",sys:-1,act:{log:[],admins:{},counts:{},roster:[]}};
let PW="";try{PW=localStorage.getItem("rev14pw")||"";S.who=localStorage.getItem("rev14who")||""}catch(e){}
function toast(m){const t=$("#ts");t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,3000)}
function login(msg){$("#lg").hidden=false;$("#lm").textContent=msg||""}
async function api(method,body,q){const r=await fetch("/api/state"+(q||""),{method,headers:{"Content-Type":"application/json","x-admin-password":PW},body:body?JSON.stringify(body):undefined});if(r.status==401)throw new Error("auth");if(!r.ok){let m="";try{m=(await r.json()).error}catch(_){}throw new Error("net: "+m)}return r.json()}
let busy=0;const send=o=>{busy++;return api("POST",Object.assign({who:S.who},o)).catch(e=>{if(e.message=="auth")login("Session expired. Sign in again.");else toast("Could not save. Check your connection.")}).finally(()=>{busy--})};
function apply(h){const n={t:{},s:{},sc:{},e:[]};let last=null;for(const[f,v]of Object.entries(h)){const p=f.split("|"),val=JSON.parse(v);if(p[0]=="t")n.t[p[1]]=val;else if(p[0]=="s")(n.s[p[1]]=n.s[p[1]]||[])[+p[2]]=val;else if(p[0]=="sc")(n.sc[p[1]]=n.sc[p[1]]||["","",""])[+p[2]]=val;else if(p[0]=="e")n.e.push(val);else if(p[0]=="m")last=val}n.e.sort((a,b)=>b.at-a.at);Object.assign(S,n,{last})}
async function pull(){if(busy)return;try{const d=await api("GET",null,S.tab=="adm"?"?activity=1":"");if(busy)return;apply(d.state);if(d.me)S.who=d.me;if(d.log)S.act={log:d.log,admins:d.admins||{},counts:d.counts||{},roster:d.roster||[]};$("#lg").hidden=true;if(!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render()}catch(e){if(e.message=="auth")login()}}
const save=()=>{};
const $=s=>document.querySelector(s);
const col=d=>HUES[d];
const dayTopics=d=>D[d-1][2].map((t,i)=>({k:d+"-"+i,d,i,c:t[0],n:t[1],s:t[2]}));
const all=()=>D.flatMap((_,i)=>dayTopics(i+1));
const dayPct=d=>{const ts=dayTopics(d);return Math.round(100*ts.filter(t=>S.t[t.k]==3).length/ts.length)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const START=new Date(2026,10,22),DAYMS=86400000;
const dateOf=d=>new Date(2026,10,22+d-1);
const sd=d=>dateOf(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const ld=d=>dateOf(d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
function todayN(now){now=now||new Date();const t=new Date(now.getFullYear(),now.getMonth(),now.getDate());return Math.round((t-START)/DAYMS)+1}
const unrated=d=>dayTopics(d).filter(t=>!S.t[t.k]);
function nextCard(n){
 n=n===undefined?todayN():n;
 const fd=D.map((_,i)=>i+1).find(d=>unrated(d).length),dn=Math.min(Math.max(n,1),14);
 let h,p,go;
 if(n<1){const k=1-n;h="Starts "+ld(1);p="In "+k+" day"+(k>1?"s":"")+". Day 1: "+D[0][1]+".";go=1}
 else if(!fd){h="All topics rated";p=n>14?"The 14 days are over. Keep clearing red and amber topics.":"Every topic has a status. Clear red and amber topics, then run the mocks.";go=dn}
 else if(fd<dn||(n>14&&fd<=14)){h="Behind schedule";p="Day "+fd+" ("+ld(fd)+") still has "+unrated(fd).length+" unrated topic(s)."+(n<=14?" Today is Day "+dn+".":" The 14 days are over.");go=fd}
 else if(fd==dn){h="Today · Day "+dn;p=ld(dn)+": "+D[dn-1][1]+". Next topic: "+unrated(dn)[0].n;go=dn}
 else{h="Ahead of schedule";p="Today's plan is rated. Next: Day "+fd+" ("+ld(fd)+"), "+D[fd-1][1]+".";go=fd}
 return `<div class="card"><h2>${esc(h)}</h2><p style="margin:0 0 10px">${esc(p)}</p><button class="btn" data-go="${go}">Open day ${go}</button></div>`}
const TABS=[["dash","Dashboard"],["days","Daily plan"],["sys","Systems"],["scores","Scores"],["errs","Error bank"],["adm","Admins"]];
function nav(){$("#nav").innerHTML=TABS.map(t=>`<button class="${S.tab==t[0]?"on":""}" data-tab="${t[0]}">${t[1]}</button>`).join("")}
function dash(){
 const a=all(),n=a.length,c=[0,0,0,0];a.forEach(t=>c[S.t[t.k]||0]++);
 const pct=Math.round(100*c[3]/n);
 const blocks=[["Foundations · Days 1–2",[1,2],"#ff6b6b"],["Blood, heart, lungs, kidneys · Days 3–6",[3,4,5,6],"#00a6a6"],["Gut, endocrine, brain, infections · Days 7–10",[7,8,9,10],"#7b5cff"],["Integration and mocks · Days 11–14",[11,12,13,14],"#ff9f1c"]];
 const bl=blocks.map(b=>{const ts=b[1].flatMap(dayTopics),g=ts.filter(t=>S.t[t.k]==3).length,p=Math.round(100*g/ts.length);
  return `<div class="lbl"><span>${b[0]}</span><b>${p}%</b></div><div class="bar"><i style="width:${p}%;background:${b[2]}"></i></div>`}).join("");
 const reds=a.filter(t=>S.t[t.k]==1).slice(0,8);
 const avg=m=>{const v=Object.values(S.sc).map(x=>parseFloat(x[m])).filter(x=>!isNaN(x));return v.length?Math.round(v.reduce((x,y)=>x+y)/v.length)+"%":"–"};
 return `<div class="grid"><div class="card ringbox"><div class="ring" style="background:conic-gradient(var(--grn) ${pct*3.6}deg,var(--line) 0)"><b>${pct}%</b></div>
 <div><h2>Topics mastered</h2><div class="stats"><span class="pill" style="background:var(--grn)">${c[3]} green</span><span class="pill" style="background:var(--amb);color:#3a2a00">${c[2]} amber</span><span class="pill" style="background:var(--red)">${c[1]} red</span><span class="pill" style="background:#9b94b3">${c[0]} to start</span></div></div></div>
 ${nextCard()}</div>
 <div class="card"><h2>Progress by block</h2>${bl}</div>
 <div class="grid"><div class="card"><h2>Average scores</h2><div class="stats"><span class="pill" style="background:var(--b2)">MCQ ${avg(0)}</span><span class="pill" style="background:var(--b3)">Essay ${avg(1)}</span><span class="pill" style="background:var(--b1)">Practical ${avg(2)}</span></div><p class="leg" style="margin-top:10px">Target: 80% or more in each. Internal goal, not a pass mark.</p></div>
 <div class="card"><h2>Red topics to tackle</h2>${reds.length?reds.map(t=>`<div class="row"><div class="t">${esc(t.n)}<div class="s">Day ${t.d} · ${t.c}</div></div></div>`).join(""):'<div class="empty">No red topics. Mark topics red when you cannot answer them reliably.</div>'}</div></div>`}
function days(){
 const d=S.day,h=D[d-1],ts=dayTopics(d),ss=S.s[d]||[];
 const chips=D.map((_,i)=>{const x=i+1,on=x==d;return `<button class="chip ${on?"on":""}${x==todayN()?" today":""}" data-day="${x}" style="${on?"background:"+col(x):""}">${x}<small>${sd(x)}</small><div class="bar"><i style="width:${dayPct(x)}%;background:${on?"#fff":col(x)}"></i></div></button>`}).join("");
 return `<div class="chips">${chips}</div>
 <div class="dayhead" style="background:${col(d)}"><h2>Day ${d} · ${ld(d)}: ${esc(h[0])}</h2><p>${esc(h[1])}</p></div>
 <div class="card"><h3>Topics</h3><p class="leg">Tap the badge to cycle: Not started, Red, Amber, Green.</p>${ts.map(t=>{const v=S.t[t.k]||0;return `<div class="row"><div class="t">${esc(t.n)}<div class="s">${t.c}</div></div><button class="tl s${v}" data-t="${t.k}">${LAB[v]}</button></div>`}).join("")}</div>
 <div class="card"><h3>Daily sessions</h3>${SES.map((s,i)=>`<label class="ck ${ss[i]?"done":""}"><input type="checkbox" data-s="${i}" ${ss[i]?"checked":""}><span>${s[0]} <small>${s[1]}</small></span></label>`).join("")}</div>`}
function scores(){
 const rows=D.map((_,i)=>{const d=i+1,v=S.sc[d]||["","",""];
  return `<div class="sc"><div class="d" style="color:${col(d)}">Day ${d}</div>${v.map((x,j)=>`<input type="number" inputmode="numeric" min="0" max="100" value="${x}" data-sc="${d}-${j}" class="${x!==""&&x>=80?"ok":""}" aria-label="Day ${d} ${["MCQ","Essay","Practical"][j]}">`).join("")}</div>`}).join("");
 return `<div class="card"><h2>Daily scores (%)</h2><p class="leg">Green cells meet the 80% target.</p><div class="sc"><div></div><div class="hd">MCQ</div><div class="hd">Essay</div><div class="hd">Practical</div></div>${rows}</div>`}
const tn=k=>{const[d,i]=k.split("-");return "Day "+d+" · "+D[d-1][2][i][1]};
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return "hsl("+h+",65%,45%)"};
function ago(t){const m=Math.round((Date.now()-t)/60000);if(m<1)return "just now";if(m<60)return m+" min ago";const h=Math.round(m/60);if(h<24)return h+" h ago";return Math.round(h/24)+" d ago"}
function adm(){const A=S.act,names=[...new Set([...(A.roster||[]),...Object.keys(A.admins)])];
 const cards=names.length?names.map(n=>`<div class="row"><div class="av" style="background:${hue(n)}">${esc(n[0]||"?").toUpperCase()}</div><div class="t"><b>${esc(n)}</b><div class="s">${A.counts[n]||0} actions · ${A.admins[n]?"active "+ago(+A.admins[n]):"no activity yet"}</div></div><button class="tl ${S.filter==n?"s3":"s0"}" data-f="${esc(n)}">${S.filter==n?"Showing":"Filter"}</button></div>`).join(""):'<div class="empty">No admins have signed in yet.</div>';
 const lg=A.log.filter(x=>!S.filter||x.who==S.filter);
 const feed=lg.length?lg.map(x=>`<div class="err" style="border-color:${hue(x.who)}"><b>${esc(x.who)}</b> ${esc(x.t)}<div class="m">${new Date(x.at).toLocaleString([],{dateStyle:"medium",timeStyle:"short"})} · ${ago(x.at)}</div></div>`).join(""):'<div class="empty">No activity yet.</div>';
 return `<div class="card"><h2>Admins (${names.length})</h2>${cards}</div><div class="card"><h2>Recent activity${S.filter?" · "+esc(S.filter):""}</h2><p class="leg">Latest 100 actions across all admins.</p>${feed}</div>`}
function sysv(){
 const a=all().filter(t=>t.s!==undefined),pc=(x,n)=>n?Math.round(100*x/n):0;
 const cnt=l=>{const c=[0,0,0,0];l.forEach(t=>c[S.t[t.k]||0]++);return c};
 const CL=["#9b94b3","var(--red)","var(--amb)","var(--grn)"];
 const stk=(c,n)=>`<div class="stk">${[3,2,1,0].map(i=>`<i style="width:${pc(c[i],n)}%;background:${CL[i]}"></i>`).join("")}</div>`;
 const tot=cnt(a),n=a.length;
 const rows=SYS.map((sy,si)=>{const l=a.filter(t=>t.s===si),c=cnt(l);return{sy,si,l,c,n:l.length}}).filter(x=>x.n);
 const att=tot[0]<n?[...rows].sort((x,y)=>y.c[1]-x.c[1]||(y.n-y.c[0])/y.n-(x.n-x.c[0])/x.n||0).slice(0,3):[];
 const attc=tot[0]<n?[...rows].sort((x,y)=>(x.c[3]/x.n)-(y.c[3]/y.n)).slice(0,3):[];
 const head=`<div class="card"><h2>All systems</h2><div class="lbl"><span>${n-tot[0]} of ${n} topics covered (${pc(n-tot[0],n)}%)</span><b>${pc(tot[3],n)}% mastered</b></div>${stk(tot,n)}<p class="leg">Green mastered · Amber partly · Red weak · Grey not started. Covered means any status; mastered means green.</p>${attc.length?`<h3>Lowest mastery</h3>`+attc.map(x=>`<div class="lbl"><span style="color:${x.sy[1]};font-weight:600">${x.sy[0]}</span><span>${pc(x.c[3],x.n)}% · ${x.c[1]} red</span></div>`).join(""):""}</div>`;
 const cards=rows.map(({sy,si,l,c,n})=>{
  const days=[...new Set(l.map(t=>t.d))],open=S.sys===si;
  const cs=[...new Set(l.map(t=>t.c))].map(cn=>{const m=l.filter(t=>t.c==cn),cc=cnt(m);return `<div class="lbl"><span>${cn}</span><span>${cc[3]}/${m.length} green</span></div>${stk(cc,m.length)}`}).join("");
  const list=open?l.map(t=>{const v=S.t[t.k]||0;return `<div class="row"><div class="t">${esc(t.n)}<div class="s">Day ${t.d} · ${t.c}</div></div><button class="tl s${v}" data-t="${t.k}">${LAB[v]}</button></div>`}).join(""):"";
  return `<div class="card" style="border-top:6px solid ${sy[1]}"><div class="lbl"><h3 style="margin:0;color:${sy[1]}">${sy[0]}</h3><b>${pc(c[3],n)}% mastered</b></div><p class="leg">${n-c[0]} of ${n} covered · ${c[1]} red · ${c[2]} amber · Day${days.length>1?"s":""} ${days.join(", ")}</p>${stk(c,n)}${cs}<button class="btn" style="background:${sy[1]};margin-top:6px" data-sys="${si}">${open?"Hide topics":"View topics"}</button>${list}</div>`}).join("");
 return head+`<div class="grid">${cards}</div>`}
function errs(){
 const topics=all().map(t=>t.n);
 return `<div class="card"><h2>Log an error</h2><input id="en" placeholder="Topic or question" style="margin-bottom:8px"><select id="et" style="margin-bottom:8px">${TYPES.map(t=>`<option>${t}</option>`).join("")}</select><textarea id="ex" rows="3" placeholder="What was the correct principle?" style="margin-bottom:8px"></textarea><button class="btn" id="ea">Add to error bank</button></div>
 <div class="card"><h2>Error bank (${S.e.length})</h2>${S.e.length?S.e.map((e,i)=>`<div class="err"><button class="x" data-del="${i}" aria-label="Delete">×</button><b>${esc(e.n)}</b><div class="m">${e.t} · ${e.d}${e.by?" · "+esc(e.by):""}</div><div>${esc(e.x)}</div></div>`).join(""):'<div class="empty">Nothing logged yet. Add every mistake with the principle behind it.</div>'}</div>`}
function render(){nav();$("#main").innerHTML={dash,days,sysv,scores,errs,adm}[S.tab]();const L=S.last;$("#last").textContent=L?"Last update by "+L.who+" at "+new Date(L.at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"Changes sync live for every admin."}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.tab){S.tab=b.dataset.tab;render();window.scrollTo(0,0);if(S.tab=="adm")pull()}
 else if(b.dataset.sys!==undefined){S.sys=S.sys===+b.dataset.sys?-1:+b.dataset.sys;const y=scrollY;render();scrollTo(0,y)}
 else if(b.dataset.f!==undefined){S.filter=S.filter==b.dataset.f?"":b.dataset.f;render()}
 else if(b.dataset.day){S.day=+b.dataset.day;render()}
 else if(b.dataset.go){S.day=+b.dataset.go;S.tab="days";render();window.scrollTo(0,0)}
 else if(b.dataset.t){S.t[b.dataset.t]=((S.t[b.dataset.t]||0)+1)%4;send({op:"set",f:"t|"+b.dataset.t,v:S.t[b.dataset.t],lbl:tn(b.dataset.t)+" → "+LAB[S.t[b.dataset.t]]});const y=scrollY;render();scrollTo(0,y)}
 else if(b.dataset.del){const x=S.e.splice(+b.dataset.del,1)[0];send({op:"del",f:"e|"+x.id,lbl:"Deleted error: "+x.n});render()}
 else if(b.id=="ea"){const n=$("#en").value.trim();if(!n){$("#en").focus();return}const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);const en={id,n,t:$("#et").value,x:$("#ex").value.trim(),d:new Date().toLocaleDateString(),by:S.who,at:Date.now()};S.e.unshift(en);send({op:"set",f:"e|"+id,v:en,lbl:"Logged error: "+n});render()}
 else if(b.id=="th"){const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue("--bg").trim()=="#17122b";r.dataset.theme=dk?"light":"dark"}
 else if(b.id=="so"){try{localStorage.removeItem("rev14pw")}catch(_){}location.reload()}
 else if(b.id=="rs"){if(confirm("Clear ALL shared progress, scores and errors for every admin?")){send({op:"reset"});Object.assign(S,{t:{},s:{},sc:{},e:[]});render()}}
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset.s!==undefined){const a=S.s[S.day]||(S.s[S.day]=[]);a[+t.dataset.s]=t.checked;send({op:"set",f:"s|"+S.day+"|"+t.dataset.s,v:t.checked,lbl:"Day "+S.day+" · "+SES[+t.dataset.s][0]+(t.checked?" done":" unticked")});const y=scrollY;render();scrollTo(0,y)}
 else if(t.dataset.sc){const[d,j]=t.dataset.sc.split("-");const a=S.sc[d]||(S.sc[d]=["","",""]);const nv=t.value===""?"":Math.max(0,Math.min(100,+t.value));a[+j]=nv;send({op:"set",f:"sc|"+d+"|"+j,v:nv,lbl:"Day "+d+" "+["MCQ","Essay","Practical"][j]+" score "+(nv===""?"cleared":"= "+nv+"%")});t.classList.toggle("ok",t.value!==""&&+t.value>=80)}
});
$("#nm").value=S.who;{const n=todayN();if(n>=1&&n<=14)S.day=n}
$("#lf").addEventListener("submit",async ev=>{ev.preventDefault();PW=$("#pw").value;S.who=$("#nm").value.trim()||"Admin";try{localStorage.setItem("rev14pw",PW);localStorage.setItem("rev14who",S.who)}catch(_){}
 try{const d=await api("GET");apply(d.state);if(d.me)S.who=d.me;try{localStorage.setItem("rev14who",S.who)}catch(_){}$("#lg").hidden=true;render();send({op:"hello"})}catch(err){$("#lm").textContent=err.message=="auth"?"Wrong password.":"Server problem: "+err.message}});
render();if(PW)pull();setInterval(()=>{if(PW)pull()},8000);
</script></body></html>
